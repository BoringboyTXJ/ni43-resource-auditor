services:
  auditor:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      EXTRACTOR_BASE_URL: ${EXTRACTOR_BASE_URL:-}
      EXTRACTOR_MODEL: ${EXTRACTOR_MODEL:-}
      EXTRACTOR_API_KEY: ${EXTRACTOR_API_KEY:-}
      EXTRACTOR_API_FORMAT: ${EXTRACTOR_API_FORMAT:-chat}
      EXTRACTOR_REASONING_EFFORT: ${EXTRACTOR_REASONING_EFFORT:-}
      EXTRACTOR_JSON_SCHEMA: ${EXTRACTOR_JSON_SCHEMA:-false}
      EXTRACTOR_ENABLE_THINKING: ${EXTRACTOR_ENABLE_THINKING:-}
      CRITIC_BASE_URL: ${CRITIC_BASE_URL:-}
      CRITIC_MODEL: ${CRITIC_MODEL:-}
      CRITIC_API_KEY: ${CRITIC_API_KEY:-}
      CRITIC_API_FORMAT: ${CRITIC_API_FORMAT:-chat}
      CRITIC_REASONING_EFFORT: ${CRITIC_REASONING_EFFORT:-}
      CRITIC_JSON_SCHEMA: ${CRITIC_JSON_SCHEMA:-false}
      CRITIC_ENABLE_THINKING: ${CRITIC_ENABLE_THINKING:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_STREAM: ${LLM_STREAM:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      MAX_PDF_MB: ${MAX_PDF_MB:-40}
      MAX_CONTEXT_CHARS: ${MAX_CONTEXT_CHARS:-100000}
      MAX_SELECTED_PAGES: ${MAX_SELECTED_PAGES:-24}
      PDF_PARSER: ${PDF_PARSER:-auto}
      # The interpreter and models belong to the image, not the host machine.
      MINERU_PYTHON: /opt/mineru/bin/python
      MINERU_HOME: /opt/mineru-home
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_SMALL_BACKEND: onnx
      MINERU_TIER: ${MINERU_TIER:-basic}
      MINERU_TIMEOUT_SECONDS: ${MINERU_TIMEOUT_SECONDS:-300}
      EVOLUTION_LOG: /app/data/evolution.jsonl
    volumes:
      - audit_data:/app/data
    restart: unless-stopped
volumes:
  audit_data:
