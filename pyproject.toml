[project]
name = "ni43-resource-auditor"
version = "0.1.0"
description = "Evidence-grounded mineral resource extraction with independent critique and abstention"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pdfplumber==0.11.9",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
]

[project.scripts]
resource-auditor = "resource_auditor.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resource_auditor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
